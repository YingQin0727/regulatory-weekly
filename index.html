实施，适用附件3中规定的特定豁免且豁免设有到期日。投放市场的产品必须附带符合附件5样式的符合性声明，且产品技术文件和符合性声明应在电子电气设备投放市场后保留十年。产品随附信息在第18和第19条中有描述。过渡安排方面：在2019年7月23日之前，符合RoHS的投放市场电子电气设备不得因不符合修订后的RoHS规定而被限制在乌克兰市场流通。本法规自官方公布之日起六个月（2017年9月22日）生效。","analysisMethod":"gemini+rules","detailStatus":"ok"},{"uid":"5923673bfb1f2808f04accae","runTime":"2026-10-08 16:01","country":"WALLONIA (BELGIUM)","feed":"C2P My Alerts","pubDate":"2026-10-03","titleOriginal":"Waste Decree, 27 June 1996 and Others - Amendment - (on producer responsibility, plastic bags, etc.) Decree, 23 June 2016","titleCn":"废弃物法令（1996年6月27日）及其他修订案（关于生产者责任、塑料袋等）法令，2016年6月23日","link":"http://reflex.raadvst-consetat.be/reflex/pdf/Mbbs/2016/07/08/133767.pdf","issuingAuthority":"WALLONIA (BELGIUM)","documentNumber":"未体现","lifecycleStatusCn":"已生效","statusTags":["已生效"],"effectiveDate":"未体现","mandatoryExecutionDate":"未体现","commentDeadline":"未体现","productCategories":["电子电气产品（未细分）","电池（未细分）"],"productRelevanceCn":"直接相关","complianceTopics":[],"background":"该法规对1996年6月27日的废弃物法令及其他相关规定进行了修订，重点针对生产者责任、塑料袋等内容进行了监管更新，旨在减少塑料垃圾并在零售商业中推动环保措施。","content":"禁止在零售商业中使用轻质或极轻质的一次性塑料袋。收银台使用的塑料袋禁令于2016年12月1日生效；商业中用于包装商品的其它袋子禁令于2017年3月1日生效。该法规涉及电池、电气和电子设备以及包装等相关产品及废弃物主题。","analysisMethod":"gemini+rules","detailStatus":"ok"},{"uid":"79a07d1a36afa635fbabc2e8","runTime":"2026-10-08 16:01","country":"日本","feed":"C2P My Alerts","pubDate":"2026-10-02","titleOriginal":"Radio Act Enforcement Regulations, Ordinance No. 14, 1950 and Others - Amendment - (on 700MHz band non-geostationary satellite communication system) Ministerial Ordinance No. 115, 2026","titleCn":"1950年电波法实施规则等修正案（关于700MHz频段非静止卫星通信系统）2026年省令第115号","link":"https://www.kanpo.go.jp/20261001/20261001g00217/20261001g002170008f.html","issuingAuthority":"日本总务省","documentNumber":"115","lifecycleStatusCn":"已生效","statusTags":["已生效"],"effectiveDate":"未体现","mandatoryExecutionDate":"未体现","commentDeadline":"未体现","productCategories":["无线设备（未细分）","手机"],"productRelevanceCn":"直接相关","complianceTopics":["EMC","合格评定"],"background":"日本总务省对《电波法》相关省令进行了技术修订，旨在建立允许在手机上运营700 MHz非静止卫星（NGSO）通信系统的监管框架，以规范相关无线电设备的技术标准并调整频段及功率限制。","content":"适用范围涵盖在715–718 MHz及1,920–1,980 MHz频段运行的便携式移动地球站及相关无线电设备。核心义务包括制造商或技术符合性认证申请者需证明产品符合新的技术标准，涵盖发射机功率、占用带宽、频率容差、杂散发射、天线特性等。技术变化方面，取消了原有的固定5 MHz限制，改为基于信道间隔的限制（如3 MHz间隔对应3 MHz，5 MHz间隔对应5 MHz，180 kHz间隔对应200 kHz，1.08 MHz间隔对应1.4 MHz）；针对200 kHz和1.4 MHz类别，天线功率不得超过200 mW，发射天线绝对增益不得超过3 dB。许可证申请要求方面，在715–718 MHz频段运营的便携式移动地球站的许可证申请人必须提前向持牌人及其他利益相关者提供卫星波束覆盖区域的信息。过渡安排为本修正案生效前签发的技术符合性评估、认证和许可证保持有效。例外情况未提及。生效和强制执行日期为2026年10月01日。","analysisMethod":"gemini+rules","detailStatus":"ok"},{"uid":"a419c81c511e5aefa49e6350","runTime":"2026-10-08 16:01","country":"欧盟","feed":"C2P My Alerts","pubDate":"2026-10-02","titleOriginal":"REACH Test Methods Regulation (EC) 440/2008 - Amendment - (on adaptation to technical progress and addition of test methods) Draft Regulation, September 2026","titleCn":"REACH测试方法法规 (EC) 440/2008 - 修订案（关于适应技术进步和增加测试方法）征求意见稿，2026年9月","link":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/19398-Chemicals-regulation-update-of-EU-rules-for-test-methods_en","issuingAuthority":"European Commission","documentNumber":"440/2008.","lifecycleStatusCn":"征求意见中","statusTags":["征求意见中","草案"],"effectiveDate":"未体现","mandatoryExecutionDate":"未体现","commentDeadline":"未体现","productCategories":[],"productRelevanceCn":"间接相关","complianceTopics":["RoHS/REACH"],"background":"欧盟委员会根据科学和技术进步，对(EC) No. 440/2008法规提出修订草案，旨在更新物质测试方法。","content":"适用范围涵盖物质的环境影响和人类健康影响评估。核心义务包括引入1项新测试方法、修订4项评估环境影响的现有方法、更新18项评估人类健康影响的测试方法（其中10项专注于皮肤刺激/腐蚀、严重眼损伤、眼刺激、皮肤致敏、免疫毒性和内分泌效应的体外测试）。法规正式颁布后将在欧盟官方公报公布后第二十天生效。原文未提供具体的强制执行日期和例外情况。","analysisMethod":"gemini+rules","detailStatus":"ok"},{"uid":"ee44dfb3f0bb536d383f6b59","runTime":"2026-10-08 16:01","country":"日本","feed":"C2P My Alerts","pubDate":"2026-10-02","titleOriginal":"Frequency Allocation Table, Plan, Notice No. 402, 2024 - Amendment - (on amending 715-718 MHz and 770-773 MHz band allocations) Notice No. 363, 2026","titleCn":"频率分配表计划2024年第402号公告修订版（关于修订715-718 MHz和770-773 MHz频段分配）2026年第363号公告","link":"https://www.kanpo.go.jp/20261001/20261001g00217/20261001g002170048f.html","issuingAuthority":"日本总务省","documentNumber":"402","lifecycleStatusCn":"已生效","statusTags":["已生效"],"effectiveDate":"未体现","mandatoryExecutionDate":"未体现","commentDeadline":"未体现","productCategories":["无线设备（未细分）"],"productRelevanceCn":"间接相关","complianceTopics":["频谱/SAR"],"background":"日本总务省发布了频率分配计划的修订版，与同日发布的第115号省令保持一致，旨在对700MHz频段非对地静止卫星通信系统进行调整，引入了针对特定频段的移动卫星业务辅助使用规定及功率限制。","content":"该法规适用于无线/无线电设备领域。核心义务与技术变化包括：1) 715-718 MHz频段可由移动卫星业务（地球到空间）作为紧密联系陆地移动业务的辅助业务使用；2) 770-773 MHz频段可在相同基础由移动卫星业务（空间到地球）使用；3) 针对715-718 MHz频段的传输，规定在4,500-4,900 MHz频段内任意1,000 kHz带宽内的平均功率必须为-50 dB(mW)或更低，其余所有情况保持在-30 dB(mW)或更低。原文未提供具体的过渡安排、例外情况和强制执行日期。","analysisMethod":"gemini+rules","detailStatus":"ok"},{"uid":"7cc2e4a70e8852bee686f04e","runTime":"2026-10-08 16:01","country":"欧盟","feed":"C2P My Alerts","pubDate":"2026-10-02","titleOriginal":"Minimum Values for the Electrochemical Performance and Durability of Rechargeable Industrial Batteries, Technical and Safety Parameters, and Standards for Battery Passport, Draft Delegated Regulation, September 2026","titleCn":"可充电工业电池电化学性能与耐久性最低值、技术与安全参数及电池护照标准的法规草案（委托法规），2026年9月","link":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14460-Industrial-batteries-minimum-values-for-electrochemical-performance-and-durability_en","issuingAuthority":"欧盟委员会","documentNumber":"2023/1542","lifecycleStatusCn":"征求意见中","statusTags":["草案","征求意见中"],"effectiveDate":"未体现","mandatoryExecutionDate":"未体现","commentDeadline":"未体现","productCategories":["电池（未细分）"],"productRelevanceCn":"直接相关","complianceTopics":[],"background":"欧盟委员会提议制定一项委托法规，旨在补充《欧盟电池和废电池法规 (EU) 2023/1542》，为可充电工业电池设定最低性能水平、耐久性以及电池护照要求。制定原因是由于不同电池的使用条件和模式显著影响其耐久性和性能，因此需要对不同的电池应用场景进行区分和精细化监管。","content":"适用范围主要为容量大于2 kWh且不单纯依赖外部存储的可充电工业电池，区分了住宅电池储能系统、重复性能源供应电池、按需电池和铅基电池。核心义务包括：非铅住宅储能系统容量衰减调整后须低于4%、预期寿命须超过3000次完全等效充放电循环（FEqC）、能量往返效率须超过93%；其他重复性能源供应电池衰减须低于10%、寿命超1000次FEqC；铅基重复性能源供应电池衰减须低于15%、寿命超500次FEqC；按需电池衰减须低于5%、寿命超10年。技术与测试变化包括引入应力因子（温度、放电深度、C率）计算方法，评估容量衰减和剩余寿命。认证变化包括制造商须在技术文档中补充预期电池类别、参考运行条件、应力因子及梯次利用（再利用、再 repurposing、再制造）相关评估数据。同时修改了(EU) 2023/1542的条款，要求电池护照二维码须符合EN 18220:2026标准，唯一标识符须符合EN 18219:2026标准。例外和过渡安排涉及梯次利用电池可利用历史运行数据进行合规评估。原文明示的评论截止日期为2026年10月27日。","analysisMethod":"gemini+rules","detailStatus":"ok"},{"uid":"4b84dc5863e2c366914d2499","runTime":"2026-10-08 16:01","country":"ITALY","feed":"C2P My Alerts","pubDate":"2026-10-01","titleOriginal":"Market Supervision and Sanctions for Radio Equipment, Ministerial Decree No. 101, 7 April 2017 - Amendment - (on aligns Italian market surveillance rules with the European Commission's Notice C/2024/2997) Decree No. 161, 2026","titleCn":"无线电设备市场监督和制裁，2017年4月7日第101号部长级令 - 修改版 - （关于将意大利市场监督规则与欧盟委员会公告 C/2024/2997 相一致）2026年第161号法令","link":"https://www.gazzettaufficiale.it/atto/serie_generale/caricaDettaglioAtto/originario?atto.dataPubblicazioneGazzetta=2026-09-16&atto.codiceRedazionale=26G00177&elenco30giorni=true","issuingAuthority":"意大利企业和“意大利制造”部 (MIMIT)","documentNumber":"2022/2380","lifecycleStatusCn":"已生效","statusTags":["已生效"],"effectiveDate":"未体现","mandatoryExecutionDate":"未体现","commentDeadline":"未体现","productCategories":["手机","耳机","音响/扬声器","无线设备（未细分）"],"productRelevanceCn":"直接相关","complianceTopics":["标签"],"background":"该法规旨在将意大利的市场监督规则与欧盟委员会关于解释无线电设备指令（2014/53/EU，经指令 (EU) 2022/2380 修订）通用充电器要求的公告 C/2024/2997 相一致，明确分离式充电电缆不适用通用充电器要求，并使经济运营商的义务更加清晰。","content":"适用范围涵盖《立法令》第128/2016号附件I-bis第一部分第1点所列类别和类别的无线电设备（受欧盟通用充电器规则约束的设备，如手机、平板电脑、数码相机、耳机、便携式扬声器及类似可充电设备），并覆盖所有在意大利市场提供这些产品的经济运营商（制造商、进口商和分销商）。核心义务变化包括：经济运营商可自行选择是否在包含或不包含充电设备的包装中附带充电电缆（不再强制要求必须包含充电电缆）；销售带充电设备的设备时仍须提供不带充电设备的版本；检查人员将继续检查两种版本包装是否均向消费者开放、是否显眼展示附件I-bis第三部分规定的图画、远程销售时图画是否靠近价格展示、是否提供意大利语充电能力和兼容充电器信息（可通过二维码等电子方式）、包装和说明书上是否有附件I-bis第四部分要求的标签（如无包装则在设备上），以及制造商是否符合技术充电规范（包括可访问的 USB Type-C 插座和适用于 5 V、3 A 或 15 W 以上充电设备的 USB Power Delivery）。","analysisMethod":"gemini+rules","detailStatus":"ok"},{"uid":"72e89d0c70807f8f 月26日。","analysisMethod":"gemini+rules","detailStatus":"ok"},{"uid":"e75b99d9d60b2ecd3d83792c","runTime":"2026-09-20 16:33","country":"PANAMA","feed":"C2P My Alerts","pubDate":"2026-09-17","titleOriginal":"Collection and Treatment of Electronic Waste, Draft Law No. 201, 2018","titleCn":"电子废物收集和处理，2018年第201号法案草案","link":"https://www.capac.org/images/ambiental/legislacion/Anteproyecto-para-recoleccion-tratamiento-de-los-desechos-electronicos.pdf","issuingAuthority":"Panamanian National Assembly","documentNumber":"201","lifecycleStatusCn":"草案","statusTags":["草案"],"effectiveDate":"未体现","mandatoryExecutionDate":"未体现","commentDeadline":"未体现","productCategories":["电池（未细分）","电子电气产品（未细分）","手机"],"productRelevanceCn":"直接相关","complianceTopics":[],"background":"该法案草案于2018年3月26日提交至巴拿马国民议会，旨在规范电子废物的收集和处理，以保护人类健康和环境。其监管上下文涵盖建立电子废物处理设施要求、明确市镇和废物收集公司的责任，以及规定卫生部、国家环境管理局、电子产品分销商代表、巴拿马技术大学和市镇等各方的相关职能。","content":"该法案草案适用于电池、电子电气设备（EEE）和手机。核心义务包括：拆解电子设备设施的所有者必须在其场所内提供用于收集产品所用电池和手机的容器，并与巴拿马技术大学合作提供合格人员来提取和处理电子废物中的有毒成分；市镇和废物收集公司负责组织电子废物的收集；同时规定了相关政府部门与机构在组织专家会议、培训人员、开发有毒成分清单、开展国家信息宣传运动、提高社区环保意识以及监督法律执行等方面的职责。原文未提供过渡安排、具体的例外情况以及强制执行日期。","analysisMethod":"gemini+rules","detailStatus":"ok"},{"uid":"d82cd6035e4960d5093a47be","runTime":"2026-09-20 16:33","country":"PANAMA","feed":"C2P My Alerts","pubDate":"2026-09-17","titleOriginal":"Collection and Treatment of Electronic Waste, Draft Law No. 302, 2016","titleCn":"电子废物收集与处理，2016年第302号法律草案","link":"http://www.asamblea.gob.pa/proyley/2016_P_302.pdf","issuingAuthority":"巴拿马国民议会","documentNumber":"302","lifecycleStatusCn":"草案","statusTags":["草案"],"effectiveDate":"未体现","mandatoryExecutionDate":"未体现","commentDeadline":"未体现","productCategories":["充电器","电池（未细分）","电子电气产品（未细分）"],"productRelevanceCn":"直接相关","complianceTopics":[],"background":"巴拿马国民议会于2016年2月1日引入了该法律草案，旨在规范电子废物的收集和处理，减少来自充电器、电池、手机、计算机及其他构成电子设备和家电元件的废物量，并建立相应的政府监管与执行机制。","content":"适用范围涵盖电子电气设备、手机、电池和充电器等。核心义务包括要求政府建立创新局以协同大学和民间组织开发废弃电子电气设备处理系统，并成立由卫生部和环境部代表组成的政府委员会以确保合规。委员会职责涵盖实施公共政策、推广讨论论 on of certification, etc.) Draft Law, December 2022","titleCn":"工业标准化法案第732号，1961年 - 拟议修正案 - （关于目标产品、获证产品召回令、撤销认证等）法律草案，2022年12月","link":"http://likms.assembly.go.kr/bill/billDetail.do?billId=PRC_U2E2W1L1H1D7H1C6S1R8B3R3U2X1R5","issuingAuthority":"South Korean National Assembly","documentNumber":"732","lifecycleStatusCn":"草案","statusTags":["草案"],"effectiveDate":"未体现","mandatoryExecutionDate":"未体现","commentDeadline":"未体现","productCategories":[],"productRelevanceCn":"间接相关","complianceTopics":["安全","合格评定"],"background":"该草案旨在澄清工业标准的目标并增强KS认证系统的可靠性等。具体而言，草案引入了工业标准化的定义，并将工业标准的目标从“采矿和工业产品”更改为“产品”，同时修改了与获证产品召回令相关的条款。","content":"适用范围涵盖所有产品。核心义务包括：如果获证产品在检查中不符合韩国工业标准或认证检查标准，或根据第21条(1)采取了改进令、暂停销售等措施，且为了防止对消费者生命/身体/财产造成危害的发生或蔓延，相关商业经营者可能会收到产业通商资源部长官发出的产品召回令。有关官员可能会访问工厂/营业场所检查执行情况。此外，如果获证企业故意制造/提供不符合韩国工业标准或认证检查标准的产（服）品，认证机构可撤销其认证。修正案批准后将在公布6个月后生效，过渡安排和例外等详情由总统令决定。","analysisMethod":"gemini+rules","detailStatus":"ok"},{"uid":"65da061a1dfb4102af2b0070","runTime":"2026-09-20 16:26","country":"SOUTH AUSTRALIA (AUSTRALIA)","feed":"C2P My Alerts","pubDate":"2026-09-16","titleOriginal":"Energy Products (Safety and Efficiency) Regulations, 2012","titleCn":"2012年能源产品（安全与效率）条例","link":"http://www.legislation.sa.gov.au/LZ/C/R/ENERGY%20PRODUCTS%20(SAFETY%20AND%20EFFICIENCY)%20REGULATIONS%202012/CURRENT/2012.35.UN.PDF","issuingAuthority":"South Australia Technical Regulator","documentNumber":"未体现","lifecycleStatusCn":"已生效","statusTags":["已生效"],"effectiveDate":"未体现","mandatoryExecutionDate":"未体现","commentDeadline":"未体现","productCategories":["电子电气产品（未细分）"],"productRelevanceCn":"间接相关","complianceTopics":["安全","能效","标签"],"background":"规定了在技术监管机构对相关安全与性能标准、能源性能标准或其他标准合规性满意之前，不会签发安全标签、性能注册或电气产品适用性证书。旨在规范电子电气设备和燃气具的能效与产品安全。","content":"适用范围涵盖电子电气设备及燃气具。核心义务包括确保产品符合相关的安全与性能标准、能源性能标准或其他标准，并获得安全标签、性能注册或电气产品适用性证书。技术/测试/认证变化、过渡安排、例外和具体日期在原文中未详细提供。","analysisMethod":"gemini+rules","detailStatus":"ok"},{"uid":"4ba55865c9d1ffec3f7ee6ff","runTime":"2026-09-20 16:26","country":"欧盟","feed":"C2P My Alerts","pubDate":"2026-09-16","titleOriginal":"JRC Technical Assessment of Recycling Efficiency and Recovery of Material Targets under Article 71(5) of the Batteries Regulation, Report, September 2026","titleCn":"欧盟电池法规第71(5)条下的回收效率和材料回收目标技术评估，报告，2026年9月","link":"https://publications.jrc.ec.europa.eu/repository/bitstream/JRC145625/JRC145625_01.pdf","issuingAuthority":"European Commission Joint Research Centre","documentNumber":"2023/1542","lifecycleStatusCn":"已生效","statusTags":["已生效"],"effectiveDate":"未体现","mandatoryExecutionDate":"未体现","commentDeadline":"未体现","productCategories":["电池（未细分）"],"productRelevanceCn":"直接相关","complianceTopics":[],"background":"根据《电池法规》(EU) 2023/1542第71(5)条的要求，欧洲委员会联合研究中心（JRC）制定了该技术评估，旨在审查是否应根据市场发展、材料可用性和技术进步修订废电池的回收效率和材料回收目标（附录XII B部分和C部分）。评估认为无需修改任何现有目标，并支持委员会按时完成评估工作。","content":"本评估报告不直接修改现行义务。回收效率和材料回收目标保持不变，继续适用《电池法规》中既有的规定。回收效率目标已于2025年12月31日生效，并将于2030年12月31日变得更加严格；材料回收目标将于2027年12月31日生效，并于2031年12月31日变得更加严格。自2030年1月1日起，碳、石墨和溶剂不能再从回收效率计算中排除，仅氧气、氯气和硫气仍可排除。下一次根据第71(5)条进行的审查定于2031年8月18日之前进行。","analysisMethod":"gemini+rules","detailStatus":"ok"},{"uid":"5b91910ea9b673c06ae41276","runTime":"2026-09-20 16:26","country":"CZECH REPUBLIC","feed":"C2P My Alerts","pubDate":"2026-09-15","titleOriginal":"Waste Management of Electronics, Batteries, Vehicles and Tires, Act No. 542/2020 and Others - Proposed Amendment - (on implementation of Batteries and Waste Batteries Regulation (EU) 2023/1542) Draft Law, June 2024","titleCn":"电子、电池、车辆和轮胎废物管理法案第542/2020号及其他法律修正案草案（关于实施电池与废电池法规(EU) 2023/1542）- 2024年6月","link":"https://technical-regulation-information-system.ec.europa.eu/en/notification/28566/text/D/EN","issuingAuthority":"捷克共和国","documentNumber":"2023/1542","lifecycleStatusCn":"征求意见中","statusTags":["征求意见中"],"effectiveDate":"未体现","mandatoryExecutionDate":"未体现","commentDeadline":"未体现","productCategories":["便携式电池","电子电气产品（未细分）"],"productRelevanceCn":"直接相关","complianceTopics":["标签","合格评定"],"background":"该拟议修正案的主要目标是将捷克立法调整为直接适用的欧盟电池和废电池法规 (EU) 2023/1542 的要求。它还解决了与工业电池相关的历史遗留成本，并加强了生产者延伸责任体系的监管和融资。该法律将修订关于报废产品的第 542/2020 号法令、关于指定产品合格评定的第 90/2016 号法令以及关于产品市场监督的第 87/2023 号法令。","content":"适用范围涵盖便携式电池、起动照明和点火电池、轻型交通工具电池以及并入电池的电气和电子设备。核心义务包括：第76条要求生产商确保便携式电池和起动、照明和点火电池清晰、明显且不可擦除地标有容量信息，若容量标记小于0.5×0.5厘米，则可在销售包装或设备包装上显示至少1×1厘米的标记；第77条要求电子电气设备及其他集成电池产品的生产者，其产品设计需允许最终用户或合格专业人员轻易且安全地拆卸用过或废旧电池，并提供说明书，出于安全、性能、医疗或数据完整性原因需永久连接的除外；第78条要求生产者自费设立指定的公众回收点。合格评定语言要求为捷克语。生效安排为：法律将在颁布后次月的第一天生效，但第一条第70和91点自2026年8月19日起生效，第一条第71和111点自2027年2月19日起生效。","analysisMethod":"gemini+rules","detailStatus":"ok"},{"uid":"a421835b59d0d2469d8a1502","runTime":"2026-09-20 16:26","country":"韩国","feed":"C2P My Alerts","pubDate":"2026-09-15","titleOriginal":"Safety Requirements for Portable Sealed Secondary (Rechargeable) Batteries (KC 62133-2), Notice No. 2020-138","titleCn":"便携式密封二次（可充电）电池的安全要求 (KC 62133-2)，第 2020-138 号公告","link":"http://www.kats.go.kr/content.do?cmsid=239&mode=view&page=&cid=21639","issuingAuthority":"韩国技术标准院 (KATS)","documentNumber":"2020-138","lifecycleStatusCn":"已生效","statusTags":["已生效"],"effectiveDate":"未体现","mandatoryExecutionDate":"未体现","commentDeadline":"未体现","productCategories":["可充电电池"],"productRelevanceCn":"直接相关","complianceTopics":["安全","标签"],"background":"韩国技术标准院（KATS）制定了KC 62133-2，以取代关于便携式密封二次（可充电）电池的安全要求标准KC 62133，旨在促进产品安全，并扩大适用产品范围以涵盖个人移动设备的电池。","content":"该标准适用于便携式密封二次电池，并将其适用范围扩展至安装在个人移动设备（例如最高时速为25公里/小时的电动滑板车和电动自行车）中的电池。新安全标准规定了符合IEC标准62133-2和KS C IEC 62133-2的要求和测试。公告自2020年7月21日起生效，但个人移动出行电池（不含电动自行车）自2021年8月1日起实施。","analysisMethod":"gemini+rules","detailStatus":"ok"},{"uid":"fe95aa55bc05ad386baeded5","runTime":"2026-09-20 16:26","country":"UKRAINE","feed":"C2P My Alerts","pubDate":"2026-09-13","titleOriginal":"Issues of Use of Radio Equipment and Radiating Devices by General Users of the Radio Frequency Spectrum, Decree No. 361, 2024 - Amendment - (on spectrum allocation for 758-788 MHz IMT use and 865-868 MHz SRD use), Decree No. 343, September 2026","titleCn":"关于普通无线电频谱使用者使用无线电设备和辐射装置问题的第361号法令（2024年）之修正案——（关于为758-788 MHz IMT使用和865-868 MHz SRD使用分配频谱），2026年9月第343号法令","link":"https://www.reestrnpa.gov.ua/REESTR/RNAweb.nsf/wpage/doc_card?OpenDocument&ID=C2245385CF903E2BC2258E6100295731","issuingAuthority":"Ukraine Communications Commission","documentNumber":"361","lifecycleStatusCn":"已生效","statusTags":["已生效"],"effectiveDate":"未体现","mandatoryExecutionDate":"未体现","commentDeadline":"未体现","productCategories":["无线设备（未细分）"],"productRelevanceCn":"间接相关","complianceTopics":["频谱/SAR"],"background":"乌克兰通信委员会发布了第343号法令，对第361号法令（2024年）进行修订，旨在调整和扩大特定频段的频谱分配，以适应IMT用户设备以及短距离无线电设备（SRD）的最新使用需求。","content":"本法规适用于无线电设备。核心内容包括：将IMT用户设备的频段频率分配从758-778 MHz扩大至758-788 MHz；同时在865-868 MHz频段新增分配，用于遥测、无线遥控以及功率最大至25 mW的ETSI EN 300 220非专用短距离设备（适用于遥控、遥测、远动、信令等）。原文未提及具体的测试、认证变化、过渡安排、例外规定及具体的强制执行日期。","analysisMethod":"gemini+rules","detailStatus":"ok"},{"uid":"148441623c88ee2e41f83734","runTime":"2026-09-20 15:37","country":"欧盟","feed":"EUR-Lex","pubDate":"2026-09-17","titleOriginal":"CELEX:52026XC04745: Summary of European Commission Decisions on authorisations for the placing on the market for the use and/or for use of substances listed in Annex XIV to Regulation (EC) No 1907/2006 of the European Parliament and of the Council concerning the Registration, Evaluation, Authorisation and Restriction of Chemicals (REACH) (Published pursuant to Article 64(9) of Regulation (EC) No 1907/2006)","titleCn":"关于欧盟委员会关于根据欧洲议会和理事会关于化学品注册、评估、授权和限制（REACH）的第1907/2006号条例（EC）第十四条所列物质投放市场使用和/或使用的授权决定的摘要（根据第1907/2006号条例（EC）第64条第9款发布）","link":"https://eur-lex.europa.eu/./legal-content/AUTO/?uri=CELEX:52026XC04745","issuingAuthority":"欧盟委员会","documentNumber":"52026XC04745","lifecycleStatusCn":"已生效","statusTags":["已生效"],"effectiveDate":"2026-09-17","mandatoryExecutionDate":"未体现","commentDeadline":"未体现","productCategories":[],"productRelevanceCn":"间接相关","complianceTopics":["RoHS/REACH"],"background":"该公告依据REACH法规（EC）第1907/2006号第64条第9款发布，汇总了欧盟委员会关于授予将REACH法规附件XIV所列受限物质（如三氧化铬）投放市场并用于特定用途的授权决定，说明了基于社会经济效益超过对人类健康和环境风险的考量而作出的授权批准背景。","content":"该文件适用 CEN制定了针对道路车辆用可充电内部储能电池模块和电池的性能及耐久性标准 EN 18060:2025。本决定旨在将该协调标准的参考文献在《欧盟官方公报》上发表，以赋予其合规推定效力。","content":"本决定适用于道路车辆用、带有内部储能的可充电电池（包括碱离子/锂离子/钠离子、铅酸、镍氢及组合化学体系）的电池模块和电池。核心义务在于通过采用EN 18060:2025标准，使相关电池产品推定符合(EU) 2023/1542法规中关于性能和耐久性的要求（涉及第9、10、12、13、14和78条）。合规自该标准在《欧盟官方公报》上公布之日起生效。原文未提及具体的例外情况或具体的过渡安排日期。","analysisMethod":"gemini+rules","detailStatus":"ok"},{"uid":"a75929a957587671359b040b","runTime":"2026-09-17 11:20","country":"欧盟","feed":"EUR-Lex","pubDate":"2026-09-15","titleOriginal":"CELEX:32026R2049: Commission Implementing Regulation (EU) 2026/2049 of 14 September 2026 making imports of primary cells and primary batteries of alkaline manganese dioxide originating in People’s Republic of China subject to registration with a view to allowing the levy of anti-dumping duties on the imports subject to registration","titleCn":"欧盟委员会2026年9月14日执行条例 (EU) 2026/2049，规定对原产于中华人民共和国的碱性二氧化锰原电池和原电池组的进口进行登记，以便有可能对登记进口的货物征收反倾销税","link":"https://eur-lex.europa.eu/./legal-content/AUTO/?uri=CELEX:32026R2049","issuingAuthority":"欧洲委员会","documentNumber":"32026R2049","lifecycleStatusCn":"已生效","statusTags":["已生效"],"effectiveDate":"未体现","mandatoryExecutionDate":"未体现","commentDeadline":"未体现","productCategories":["电池（未细分）"],"productRelevanceCn":"直接相关","complianceTopics":[],"background":"本法规由欧洲委员会根据基础法规（Regulation (EU) 2016/1036）第14(5)条制定。此前于2026年5月18日收到由VARTA Consumer Batteries GmbH & Co. KGaA代表占欧盟碱性二氧化锰原电池和原电池组总产量25%以上的生产商提交的申诉，欧盟委员会于2026年7月2日宣布启动反倾销调查。为了确保未来可能征收的反倾销税能够进行追溯性征收，委员会决定自行对相关进口产品实施海关登记。","content":"适用范围：原产于中华人民共和国的碱性二氧化锰原电池和原电池组（形式为圆柱形电池、不可充电、未耗尽、非废料和废碎料、不含零件，目前归入CN代码 8506 10 11）。核心义务：海关当局被指示采取适当步骤对相关进口产品进行登记。技术/测试/认证变化：未提及。过渡安排：登记在实施条例生效之日起九个月后失效。例外和日期：自欧盟官方公报公布的次日（即2026年9月16日）起生效。","analysisMethod":"gemini+rules","detailStatus":"ok"},{"uid":"0d131d7976d13aa37bc5fdf2","runTime":"2026-09-09 17:15","country":"欧盟","feed":"EU Standards Notification System","pubDate":"2026-07-16","titleOriginal":"Draft standardisation request in support of the implementation of Commission Regulation (EU) 2025/2052","titleCn":"中文翻译待补充：Draft standardisation request in support of the implementation of Commission Regulation (EU) 2025/2052","link":"https://single-market-economy.ec.europa.eu/document/download/ab440ff2-173a-4d95-ae90-dd7a6f3db921_en?filename=Draft%20SReq%20Ecodesign%20EPS%20External%20Power%20suppl.pdf","issuingAuthority":"欧盟委员会 (European Commission)","documentNumber":"2025/2052","lifecycleStatusCn":"草案","statusTags":["草案","征求意见中"],"effectiveDate":"未体现","mandatoryExecutionDate":"未体现","commentDeadline":"2026-09-14","productCategories":["电源适配器","无线充电器","便携式电池"],"productRelevanceCn":"直接相关","complianceTopics":["能效","标签","合格评定","计量/质量"],"background":"本法规草案是一项针对欧洲标准化组织（CENELEC和ETSI）的标准化请求（Standardisation Request），旨在支持委员会条例 (EU) 2025/2052 的实施。该条例规定了外部电源供应器、无线充电器、无线充电垫、通用便携式电池充电器以及USB Type-C电缆的生态设计要求，并废除了旧有的委员会条例 (EU) 2019/1782。随着技术进步及欧盟绿色转型，旧标准（如 EN 50563 及 M/450 授权）已无法完全覆盖现行的范围、能效以及新增的互操作性、浪涌抗扰度和待机功耗等要求，因此需要制定全新标准或修订现行标准以提供符合性推定依据。","content":"本文件直接影响外部电源、无线充电器、无线充电垫、通用便携式电池充电器及USB Type-C电缆制造商。重点内容包括：1）适用范围扩展至上述各类充电及供电设备；2）核心义务包括满足更新的能效要求（含平均有功效率、10%低负载效率及空载功耗）、互操作性要求（如配备USB Type-C或USB-PD端口、独立端口操作等）、浪涌抗扰度要求（适用于可互操作的EPS）以及无线充电器的待机功耗要求；3）技术与测试变化要求修订 EN 50563 标准，引入对多协议自适应电源的支持及与美国能源部（DOE）测试程序等国际先进方法的对齐；4）过渡安排与关键日期方面，欧洲标准化组织需在收到通知后36个月内完成相关标准的制定与修订工作，废除旧标准化授权 M/450，并规定了具体的年度报告及有效期限。","analysisMethod":"gemini+rules","detailStatus":"ok"},{"uid":"de6b7465b7a4686a4aac877d","runTime":"2026-09-09 16:56","country":"欧盟","feed":"EU Standards Notification System","pubDate":"2026-07-16","titleOriginal":"Draft standardisation request amending Commission Implementing Decision C(2025)618","titleCn":"中文翻译待补充：Draft standardisation request amending Commission Implementing Decision C(2025)618","link":"https://single-market-economy.ec.europa.eu/document/download/57cbdc82-02fa-4d32-93f4-67480747c896_en?filename=1st%20CRA%20SReq%20amd.pdf","issuingAuthority":"未体现","documentNumber":"2024/2847","lifecycleStatusCn":"征求意见中","statusTags":["征求意见中","草案"],"effectiveDate":"未体现","mandatory const $=id=>document.getElementById(id);

const text=v=>v&&v!=="未体现"&&v!=="-"?String(v):"—";

const dateOf=v=>/^\d{4}-\d{2}-\d{2}/.test(String(v||""))?String(v).slice(0,10):"";
const weekKey=v=>{const s=dateOf(v);if(!s)return"";const d=new Date(s+"T00:00:00Z");d.setUTCDate(d.getUTCDate()-((d.getUTCDay()+6)%7));return d.toISOString().slice(0,10)};

const progressOf=r=>text(r.progress||r.currentProgress);

function certOf(r){
  const s=(arr(r.complianceTopics).join(" ")+" "+(r.feed||"")+" "+(r.titleCn||"")+" "+(r.titleOriginal||"")).toLowerCase();
  const out=[];
  if(/radio|wireless|frequency|spectrum|sar|fcc|rra|srrc|无线|频谱/.test(s))out.push("无线认证");
  if(/emc|电磁兼容/.test(s))out.push("EMC");
  if(/safety|lvd|安全/.test(s))out.push("安全");
  if(/energy|efficiency|能效/.test(s))out.push("能效");
  if(/rohs|reach|hazard|有害物质/.test(s))out.push("RoHS/REACH");
  if(/label|标签/.test(s))out.push("标签");
  if(/cyber|security|网络安全/.test(s))out.push("网络安全");
  if(/battery|电池/.test(s))out.push("电池合规");
  return out.length?out:["其他/未分类"];
}
function short(v,n){const s=text(v);return s.length>n?s.slice(0,n)+"…":s}
function numbered(v){
  const s=text(v);if(s==="—")return s;
  if(/(^|\n)\s*\d+[\.、）)]/.test(s))return s;
  const p=s.split(/(?<=[。；])\s*/).map(x=>x.trim()).filter(Boolean);
  return p.length>1?p.map((x,i)=>(i+1)+". "+x).join("\n"):s;
}
function fillSelect(id,values,label){$(id).innerHTML='<option value="全部">'+label+'</option>'+uniq(values).map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join("")}
fillSelect("country",records.map(r=>r.country),"全部");
fillSelect("status",records.flatMap(r=>[statusOf(r),...arr(r.statusTags)]),"全部");
fillSelect("product",records.flatMap(r=>arr(r.productCategories)),"全部");

fillSelect("group",records.map(groupOf),"全部");
fillSelect("owner",records.map(ownerOf),"全部");
$("updatedAt").textContent=records[0]?.runTime||"—";
let currentView="week";
const viewMeta={
  week:["本周新增法规","优先展示本周更新，点击任一法规可查看完整解读及原文。"],
  history:["历史新增法规","按监测记录查看全部历史法规更新。"],
  issues:["抓取异常","集中查看AI未完成、详情缺失或需要人工核验的记录。"],
  ongoing:["在途法规","展示草案、征求意见中及修订过程中的法规。"],
  done:["已完成法规","展示已发布、已生效、废止或替代的法规。"],
  report:["法规监测周报","汇总本周法规更新及关键执行节点。"]
};
function matchView(r){
  const st=statusOf(r),method=String(r.analysisMethod||"").toLowerCase(),detail=String(r.detailStatus||"").toLowerCase();
  if(currentView==="week"||currentView==="report")return weekKey(r.runTime)===latestWeek;
  if(currentView==="history")return true;
  if(currentView==="issues")return detail!=="ok"||method==="rules"||method.includes("pending");
  if(currentView==="ongoing")return /草案|征求意见|修订/.test(st+" "+arr(r.statusTags).join(" "));
  if(currentView==="done")return /已发布|已生效|废止|替代/.test(st+" "+arr(r.statusTags).join(" "));
  return true;
}
function card(r,i){
  const cert=certOf(r).join(" · "),products=arr(r.productCategories).join(" · ")||"—",topics=arr(r.complianceTopics).join(" · ")||"—";
  const issue=String(r.detailStatus||"").toLowerCase()!=="ok"||String(r.analysisMethod||"").toLowerCase()==="rules"||String(r.analysisMethod||"").toLowerCase().includes("pending");

  return '<details class="card" '+(i===0?'open':'')+'><summary><span class="num">'+String(i+1).padStart(2,"0")+'</span><div class="summary-main"><div class="tags"><span class="tag region">'+esc(text(r.country))+'</span><span class="tag">'+esc(cert)+'</span><span class="tag '+statusClass+'">'+esc(statusOf(r))+'</span>'+(issue?'<span class="tag issue">需人工核验</span>':'')+'</div><h3>'+esc(text(r.titleCn))+'</h3><div class="quick"><div><small>提出日期</small><b>'+esc(text(r.pubDate))+'</b></div><div><small>强制执行日期</small><b>'+esc(text(r.mandatoryExecutionDate))+'</b></div><div><small>意见反馈截至日期</small><b>'+esc(text(r.commentDeadline))+'</b></div><div><small>影响产品</small><b>'+esc(products)+'</b></div></div><p class="brief">'+esc(short(r.content,210))+'</p></div><span class="chev">⌄</span></summary><div class="detail"><div class="detail-grid"><div><section class="panel"><h4>事项简述</h4><p>'+esc(text(r.titleCn))+'</p></section><section class="panel"><h4>法规 / 标准重点描述</h4><p>'+esc(numbered(r.content))+'</p></section><section class="panel"><h4>AI 翻译 / 解读</h4><p><b>法规背景</b>\n'+esc(numbered(r.background))+'\n\n<b>重点内容</b>\n'+esc(numbered(r.content))+'</p></section></div><div><div class="facts"><div class="fact"><small>区域</small><b>'+esc(text(r.country))+'</b></div><div class="fact"><small>认证类型</small><b>'+esc(cert)+'</b></div><div class="fact"><small>发布机关</small><b>'+esc(text(r.issuingAuthority))+'</b></div><div class="fact"><small>文号</small><b>'+esc(text(r.documentNumber))+'</b></div><div class="fact"><small>状态</small><b>'+esc(statusOf(r))+'</b></div><div class="fact"><small>合规领域</small><b>'+esc(topics)+'</b></div><div class="fact"><small>组别</small><b>'+esc(groupOf(r))+'</b></div><div class="fact"><small>责任人</small><b>'+esc(ownerOf(r))+'</b></div><div class="fact"><small>当前进展</small><b>'+esc(progressOf(r))+'</b></div><div class="fact"><small>相关文档</small><b>'+esc(docOf(r)?"已关联":"—")+'</b></div><div class="fact"><small>发布来源</small><b>'+esc(text(r.feed))+'</b></div></div><div class="links">'+(docOf(r)?'<a class="link" href="'+esc(docOf(r))+'" target="_blank" rel="noreferrer">相关文档 ↗</a>':'')+'<a class="link" href="https://mi.feishu.cn/wiki/OMxvwAylvidpRokb1fEcGKtFnXP?sheet=9dkwHT" target="_blank" rel="noreferrer">飞书表格 ↗</a><a class="link primary" href="'+esc(r.link)+'" target="_blank" rel="noreferrer">原文 / 链接 ↗</a></div></div></div></div></details>'
}
function render(){
  const f={country:$("country").value,status:$("status").value,product:$("product").value,certType:$("certType").value,group:$("group").value,owner:$("owner").value};
  const q=$("search").value.trim().toLowerCase();
  const visible=records.filter(r=>{
    const hay=[r.titleCn,r.titleOriginal,r.country,r.feed,r.issuingAuthority,r.documentNumber,r.background,r.content,...arr(r.productCategories),...arr(r.complianceTopics),...certOf(r),groupOf(r),ownerOf(r),progressOf(r)].join(" ").toLowerCase();
    return matchView(r)&&(!q||hay.includes(q))&&(f.country==="全部"||r.country===f.country)&&(f.status==="全部"||statusOf(r)===f.status||arr(r.statusTags).includes(f.status))&&(f.product==="全部"||arr(r.productCategories).includes(f.product))&&(f.certType==="全部"||certOf(r).includes(f.certType))&&(f.group==="全部"||groupOf(r)===f.group)&&(f.owner==="全部"||ownerOf(r)===f.owner);
  });
  $("count").textContent=visible.length;$("statTotal").textContent=visible.length;$("statDirect").textContent=visible.filter(r=>r.productRelevanceCn==="直接相关").length;$("statConsult").textContent=visible.filter(r=>/征求/.test(statusOf(r)+" "+arr(r.statusTags).join(" "))).length;
  const ref=Date.parse((records[0]?.runTime||"").slice(0,10));$("statDue").textContent=visible.filter(r=>{const t=Date.parse(r.mandatoryExecutionDate);return Number.isFinite(t)&&Number.isFinite(ref)&&t>=ref&&t-ref<=60*864e5}).length;
